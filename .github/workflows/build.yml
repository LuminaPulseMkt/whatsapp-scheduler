name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Permissão para gradlew
        run: chmod +x gradlew

      - name: Build APK Debug
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk whatsapp-scheduler.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WhatsApp Scheduler - Ultima versao"
          body: |
            Baixe o APK abaixo e instale no seu celular Android.

            > **Importante:** Antes de instalar, ative "Fontes desconhecidas" nas configuracoes do Android.
          files: whatsapp-scheduler.apk
          prerelease: false
          make_latest: true
